# リリース用のパイプライン（specs/004-infra-cicd/contracts/pipeline.md の「pipeline.yml」）
# main への push（= PR のマージ）ごとに、ci を 1 回 → cd-dev（承認なし）→ cd-prod（Environment prod の承認後）。
# リポジトリは public なので、ログ・ジョブサマリーに秘密の値を出さない。plan ファイルは artifact にしない。
name: pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGION: us-east4
  TERRAFORM_VERSION: 1.17.1
  # Terraform のチェックポイント（バージョン確認の通信）を止める
  CHECKPOINT_DISABLE: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pipeline-main
      cancel-in-progress: false
    permissions:
      contents: read
      # Workload Identity Federation（ci-builder）
      id-token: write
      # prod で動いているコミット（Environment prod のデプロイ履歴）を読む
      deployments: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_BASE_URL: postgresql://postgres:postgres@localhost:5432
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbta_live_test
      GH_TOKEN: ${{ github.token }}
    outputs:
      image: ${{ steps.push.outputs.image }}
      prod_plan_hash: ${{ steps.plan.outputs.prod_plan_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # コミット一覧・マイグレーションの差分・互換性テスト・Gitleaks（履歴全体）に使う
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test databases
        run: |
          for db in mbta_live_test mbta_live_compat mbta_live_container; do
            psql "$PG_BASE_URL/postgres" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE $db"
          done

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Replay tests
        run: pnpm test:replay

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        # ブラウザはキャッシュから戻し、OS の依存パッケージだけは毎回入れる
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: E2E tests (002 TR-003)
        # E2E 用の DB はシード（tests/e2e/seed-db.ts --migrate）が作る。本番と同じビルドを起動して確かめる
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbta_live_e2e
        run: pnpm test:e2e

      - name: Upload E2E traces
        # 失敗したテストのトレース（画面・通信の記録）。データはフィクスチャだけ
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

      - name: Migration compatibility (TR-003)
        # 新しいマイグレーションを適用した DB に、prod で動いているコミットの結合テストを実行する
        run: scripts/check-migration-compat.sh "$PG_BASE_URL/mbta_live_compat"

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Secret scan (Gitleaks, full history)
        # リポジトリの履歴全体を走査する。設定は .gitleaks.toml。見つかった値はログで伏せ字にする
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Build image
        run: docker build -t "mbta-live:${{ github.sha }}" .

      - name: Check container (TR-006)
        run: scripts/check-container.sh "mbta-live:${{ github.sha }}" "$PG_BASE_URL/mbta_live_container"

      - name: Authenticate to Google Cloud (ci-builder)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CI_WIF_PROVIDER }}
          service_account: ${{ vars.CI_BUILDER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Push image
        id: push
        env:
          REPOSITORY: ${{ vars.ARTIFACT_REGISTRY }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          tag="$REPOSITORY/mbta-live:${{ github.sha }}"
          docker tag "mbta-live:${{ github.sha }}" "$tag"
          docker push "$tag"
          # dev と prod には、タグではなくダイジェストでデプロイする（同じイメージであることを保証する）。
          # RepoDigests にはローカルの名前のものも入りうるので、Artifact Registry のものを選ぶ
          image="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep "^$REPOSITORY/mbta-live@sha256:" | head -n 1)"
          if [ -z "$image" ]; then
            echo "push したイメージのダイジェストが見つかりません" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "イメージ: $image"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # plan の出力をそのまま出さないよう、ラッパーを使わない
          terraform_wrapper: false

      - name: Terraform fmt / validate (TR-001)
        run: |
          pnpm infra:fmt
          pnpm infra:validate

      - name: Terraform plan (dev / prod)
        id: plan
        env:
          TF_VAR_image: ${{ steps.push.outputs.image }}
        run: |
          for env in dev prod; do
            dir="infra/terraform/envs/$env"
            # state がまだない環境（最初のデプロイの前）では、GCS の backend の init が空の state を書こうとして、
            # 読み取りだけの ci-builder では失敗する。そのときは空のローカルの state で plan する（結果は同じ）
            bucket="$(sed -n 's/^ *bucket *= *"\(.*\)"/\1/p' "$dir/backend.tf")"
            if ! out="$(gcloud storage ls "gs://$bucket/envs/$env/default.tfstate" 2>&1)"; then
              # 権限の誤りなどで ls が失敗したときに、空の state で plan してしまわないよう、「ない」ときだけに限る
              if ! grep -q "matched no objects" <<<"$out"; then
                echo "$out" >&2
                exit 1
              fi
              echo "== $env: state がまだないので、空の state で plan する"
              printf 'terraform {\n  backend "local" {}\n}\n' > "$dir/backend_override.tf"
            fi
            # ci-builder は読み取りだけなので、ロックを取らない。plan の全文はログに出さない（要約だけをサマリーに出す）
            terraform -chdir="$dir" init -input=false -lock=false -no-color >/dev/null
            terraform -chdir="$dir" plan -input=false -lock=false -no-color -out="$RUNNER_TEMP/$env.tfplan" >/dev/null
            terraform -chdir="$dir" show -json "$RUNNER_TEMP/$env.tfplan" > "$RUNNER_TEMP/$env.plan.json"
            echo "== $env"
            scripts/plan-summary.sh "$RUNNER_TEMP/$env.plan.json"
          done
          echo "prod_plan_hash=$(scripts/plan-hash.sh "$RUNNER_TEMP/prod.plan.json")" >> "$GITHUB_OUTPUT"

      - name: Approval summary (FR-021)
        run: scripts/approval-summary.sh "$RUNNER_TEMP/dev.plan.json" "$RUNNER_TEMP/prod.plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plan files
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.tfplan "$RUNNER_TEMP"/*.plan.json

  cd-dev:
    name: cd-dev
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.ci.outputs.image }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (deployer-dev)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform apply (envs/dev)
        env:
          TF_VAR_image: ${{ env.IMAGE }}
        run: |
          terraform -chdir=infra/terraform/envs/dev init -input=false -no-color
          terraform -chdir=infra/terraform/envs/dev apply -input=false -auto-approve -no-color

      - name: Migrate
        run: |
          gcloud run jobs update migrate --image="$IMAGE" --project="$PROJECT" --region="$REGION" --quiet
          gcloud run jobs execute migrate --project="$PROJECT" --region="$REGION" --wait

      - name: Deploy web
        run: |
          # ロールバック（rollback.yml）の戻し先として、今トラフィックが流れているリビジョンに previous タグを付ける
          previous="$(gcloud run services describe web --project="$PROJECT" --region="$REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // ""')"
          gcloud run deploy web --image="$IMAGE" --project="$PROJECT" --region="$REGION" --quiet
          current="$(gcloud run services describe web --project="$PROJECT" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
            gcloud run services update-traffic web --update-tags="previous=$previous" \
              --project="$PROJECT" --region="$REGION" --quiet
          fi

      - name: Update jobs
        run: |
          for job in collector sync-static aggregate; do
            gcloud run jobs update "$job" --image="$IMAGE" --project="$PROJECT" --region="$REGION" --quiet
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke test (TR-002)
        env:
          SMOKE_TESTER_SA: ${{ vars.SMOKE_TESTER_SA }}
          # IAP の OAuth クライアントの ID（bootstrap が登録）。IAP はこれを audience とする ID トークンを受け付ける
          IAP_CLIENT_ID: ${{ vars.IAP_CLIENT_ID }}
        run: |
          url="$(gcloud run services describe web --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          scripts/smoke.sh "$url"

      - name: Run collector once
        # Secret Manager、DB、MBTA API への接続をまとめて確かめる
        run: gcloud run jobs execute collector --project="$PROJECT" --region="$REGION" --wait

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: E2E on dev (TR-007)
        # 読み取りだけの短いテスト（地図・地図タイル・駅・アラート・稼働状況）を、IAP を通して実行する。
        # collector を動かしたあとなので、最新のデータで確かめられる
        env:
          SMOKE_TESTER_SA: ${{ vars.SMOKE_TESTER_SA }}
          IAP_CLIENT_ID: ${{ vars.IAP_CLIENT_ID }}
        run: |
          url="$(gcloud run services describe web --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          scripts/dev-e2e.sh "$url"

  cd-prod:
    name: cd-prod
    needs: [ci, cd-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Required reviewers（オーナー）の承認を待つ。承認者は ci のジョブサマリー（承認用のサマリー）を見て判断する
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      # prod で動いているコミット（新しいマイグレーションの有無）を Environment prod のデプロイ履歴から読む
      deployments: read
    env:
      IMAGE: ${{ needs.ci.outputs.image }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      SMOKE_TESTER_SA: ${{ vars.SMOKE_TESTER_SA }}
      IAP_CLIENT_ID: ${{ vars.IAP_CLIENT_ID }}
    steps:
      - name: Require the latest main (FR-006)
        # 承認待ちの古い run を承認しても、古いイメージで prod を上書きしない
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "この run のコミット（$GITHUB_SHA）は main の最新（$head）ではないので、prod にデプロイしません" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 新しいマイグレーションの有無を、prod で動いているコミットとの差分で調べる
          fetch-depth: 0

      - name: Authenticate to Google Cloud (deployer-prod)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform plan and compare with the approved plan (FR-007)
        env:
          TF_VAR_image: ${{ env.IMAGE }}
          APPROVED_PLAN_HASH: ${{ needs.ci.outputs.prod_plan_hash }}
        run: |
          dir=infra/terraform/envs/prod
          terraform -chdir="$dir" init -input=false -no-color >/dev/null
          # plan の全文はログに出さない（要約だけを出す）
          terraform -chdir="$dir" plan -input=false -no-color -out="$RUNNER_TEMP/prod.tfplan" >/dev/null
          terraform -chdir="$dir" show -json "$RUNNER_TEMP/prod.tfplan" > "$RUNNER_TEMP/prod.plan.json"
          scripts/plan-summary.sh "$RUNNER_TEMP/prod.plan.json"
          hash="$(scripts/plan-hash.sh "$RUNNER_TEMP/prod.plan.json")"
          if [ "$hash" != "$APPROVED_PLAN_HASH" ]; then
            echo "prod の plan が、承認時（ci）の plan と違います（承認時: $APPROVED_PLAN_HASH、今: $hash）。適用しません" >&2
            exit 1
          fi
          echo "plan は承認時と同じです（$hash）"

      - name: Terraform apply (envs/prod)
        # 確かめた plan ファイルをそのまま適用する
        run: terraform -chdir=infra/terraform/envs/prod apply -input=false -no-color "$RUNNER_TEMP/prod.tfplan"

      - name: Back up the database before new migrations (FR-019)
        run: |
          prod_sha="$(scripts/prod-deployed-sha.sh)"
          if [ -z "$prod_sha" ]; then
            echo "prod へのデプロイはまだない（最初のリリース）ので、バックアップを取りません"
            exit 0
          fi
          if ! git diff --name-only --diff-filter=A "$prod_sha" HEAD -- prisma/migrations | grep -q 'migration.sql$'; then
            echo "prod（$prod_sha）からの新しいマイグレーションはないので、バックアップを取りません"
            exit 0
          fi
          instance="$(terraform -chdir=infra/terraform/envs/prod output -raw sql_instance)"
          # 完了まで待つ（--async を付けない）
          gcloud sql backups create --instance="$instance" --project="$PROJECT" \
            --description="before migrations of $GITHUB_SHA"

      - name: Migrate
        run: |
          gcloud run jobs update migrate --image="$IMAGE" --project="$PROJECT" --region="$REGION" --quiet
          gcloud run jobs execute migrate --project="$PROJECT" --region="$REGION" --wait

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy web as candidate (no traffic)
        id: candidate
        run: |
          # 切り替え前に流れているリビジョン（失敗したときの戻し先）
          previous="$(gcloud run services describe web --project="$PROJECT" --region="$REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // ""')"
          gcloud run deploy web --image="$IMAGE" --project="$PROJECT" --region="$REGION" \
            --no-traffic --tag=candidate --quiet
          service="$(gcloud run services describe web --project="$PROJECT" --region="$REGION" --format=json)"
          revision="$(jq -r '.status.traffic[] | select(.tag == "candidate") | .revisionName' <<<"$service")"
          url="$(jq -r '.status.traffic[] | select(.tag == "candidate") | .url' <<<"$service")"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "直前のリビジョン: ${previous:-なし}、新しいリビジョン: $revision（$url）"

      - name: Smoke test the candidate (FR-018)
        # 失敗したら、トラフィックを切り替えずに終わる（利用者は前のリビジョンを使い続ける）
        run: scripts/smoke.sh "${{ steps.candidate.outputs.url }}"

      - name: Switch traffic and smoke test (FR-018)
        env:
          PREVIOUS: ${{ steps.candidate.outputs.previous }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic web --to-revisions="$REVISION=100" \
            --project="$PROJECT" --region="$REGION" --quiet
          url="$(gcloud run services describe web --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          if ! scripts/smoke.sh "$url"; then
            if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$REVISION" ]; then
              echo "切り替え後のスモークテストに失敗したので、直前のリビジョン（$PREVIOUS）に戻します" >&2
              gcloud run services update-traffic web --to-revisions="$PREVIOUS=100" \
                --project="$PROJECT" --region="$REGION" --quiet
            fi
            exit 1
          fi
          # ロールバック（rollback.yml）の戻し先として、直前のリビジョンに previous タグを付ける
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$REVISION" ]; then
            gcloud run services update-traffic web --update-tags="previous=$PREVIOUS" \
              --project="$PROJECT" --region="$REGION" --quiet
          fi

      - name: Update jobs
        run: |
          for job in collector sync-static aggregate; do
            gcloud run jobs update "$job" --image="$IMAGE" --project="$PROJECT" --region="$REGION" --quiet
          done

      - name: Run collector once
        run: gcloud run jobs execute collector --project="$PROJECT" --region="$REGION" --wait

      - name: Remove plan files
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.tfplan "$RUNNER_TEMP"/*.plan.json
